          type: integer
          description: Earliest model year, inclusive.
        year_max:
          type: integer
          description: Latest model year, inclusive.
        price_min:
          type: integer
          description: Minimum price in USD, inclusive.
        price_max:
          type: integer
          description: Maximum price in USD, inclusive.
        bodytype:
          type: string
          enum: [SUVs, Trucks, Vans, Sedans]
          description: Body style.
        keyword:
          type: string
          description: Free-text match, e.g. an exterior color.
        limit:
          type: integer
          description: Records per page.
        page:
          type: integer
          description: 1-indexed page number.
      required: []
