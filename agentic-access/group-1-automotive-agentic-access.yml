summary: >-
  Group 1 Automotive publishes a deliberate, first-party AI-agent access contract in the form of
  an llms.txt on two of its own hosts. It is not an API program — there is no OpenAPI, no key,
  no portal — but it is an explicit, documented, anonymous read surface built for LLM clients,
  and it works: the endpoints it advertises return live inventory. This artifact records that
  surface as the company actually published it.
