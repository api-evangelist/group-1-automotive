agent_policy:
  robots_txt: https://www.group1auto.com/robots.txt
  robots_txt_status: 200
  user_agent_rules: 'User-agent: * — no agent is named, allowed or denied specifically.'
  crawl_delay_seconds: 1
  disallowed_paths:
    - /wp-admin/
    - /wp-includes/
    - /wp-content/uploads/inventory/
    - /wp-content/uploads/pb_backupbuddy/
    - /wp-content/uploads/chromeData/
    - /wp-content/uploads/configuratorTron/
    - /wp-content/uploads/gravity_forms/
  llm_paths_disallowed: false
  note: >-
    robots.txt does not disallow /llm/, so the advertised agent endpoint is crawlable under the
    site's own rules. There is no ai.txt, no AIPREF signal, and no Content-Signal header. The
    Terms of Use at https://www.group1auto.com/terms-of-use/ (effective 2026-06-29) does contain
    an "AI tool usage" section, so the company's agent posture is split across two documents that
    do not reference each other.
divergence:
  finding: >-
    The surface Group 1 advertises to agents is reachable by a browser-class client and refused
    to a plain HTTP client. Cloudflare bot management on www.group1auto.com answered HTTP 403 to
    every curl request for /llm/inventory/ (and for the site root, /openapi.json, /wp-json/ and
    /sitemap.xml) even with a current desktop browser User-Agent, while the same URL fetched
    through a browser-class path returned the full inventory listing. /llms.txt and /robots.txt
    themselves are served to plain clients at 200.
  implication: >-
    An agent that speaks plain HTTP reads the llms.txt telling it to call /llm/inventory/, then
    gets a 403 at that endpoint. The instruction and the enforcement disagree. This is a
    provider-side edge-policy gap, not an absence of intent — the endpoint is real and the
    content is there.
  evidence:
    - url: https://www.group1auto.com/llms.txt
      client: curl (desktop browser UA)
      status: 200
    - url: https://www.group1auto.com/llm/inventory/
      client: curl (desktop browser UA)
      status: 403
      body: Cloudflare "Attention Required!" interstitial, 4,569 bytes
    - url: https://www.group1auto.com/llm/inventory/?bodytype=SUVs&limit=2
      client: browser-class fetch
      status: 200
      body: server-rendered inventory listing, 26,088 records reported
gaps:
  - No JSON representation. format=json is ignored; /llm/inventory.json returns the site 404.
  - No OpenAPI, AsyncAPI, GraphQL SDL or Postman collection describing the endpoint.
  - No /.well-known/api-catalog pointing at the surface (all /.well-known/ paths 404).
  - No MCP server and no A2A agent card.
  - llms.txt does not state a rate limit, a change policy, a contact, or terms for agent use.
