apis:
  - aid: group-1-automotive-llm-inventory
    name: Group 1 Automotive LLM Inventory Browse
    description: >-
      A server-rendered, anonymous HTTP read surface that Group 1 Automotive publishes
      specifically for AI assistants, advertised in its own /llms.txt. GET /llm/inventory/
      returns paginated live vehicle inventory as plain HTML (no JavaScript required), filtered
      by the documented query parameters type, make, model, year_min, year_max, price_min,
      price_max, bodytype, keyword, limit and page. Observed 2026-08-28 returning 26,088 SUV
      records with VIN, year, model, trim, new/used status, mileage and price. No API key, no
      OpenAPI description, and no JSON representation are published.
    humanURL: https://www.group1auto.com/llms.txt
    baseURL: https://www.group1auto.com/llm/
