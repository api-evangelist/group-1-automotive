aid: group-1-automotive
name: "Group 1 Automotive"
specificationVersion: '0.23'
description: >-
  Group 1 Automotive (NYSE: GPI) is an international Fortune 500 automotive retailer operating
  automotive dealerships, collision centers and service departments across the United States,
  the United Kingdom and Brazil, representing more than 35 vehicle brands. Group 1 does not
  operate a public developer program, but it does publish an AI-agent-facing surface: an
  llms.txt on www.group1auto.com and on its AcceleRide digital-retail site www.shopgroup1.com,
  each advertising a documented, parameterized, server-rendered vehicle-inventory browse
  endpoint at /llm/inventory/ that returns live new and used inventory (VIN, year, model, trim,
  mileage, price) without JavaScript, authentication, or an API key. There is no OpenAPI,
  AsyncAPI, GraphQL SDL, MCP server, agent card, SDK or partner API reference published anywhere
  on the company's own hosts.
